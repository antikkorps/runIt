[package]
name = "runit"
version = "0.1.0"
edition = "2021"
description = "Fuzzy-pick a command from markdown notes, fill in its <parameters>, and output it ready to run"

# The binary is called `runit`. Possible collision with the runit init system:
# to rename it, just change the `name` line below.
[[bin]]
name = "runit"
path = "src/main.rs"

# MVP deliberately dependency-free: std alone, leaning on fzf as an external tool.
[dependencies]
