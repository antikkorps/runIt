name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    # Depend des labels declares par le runner Forgejo (config.yml, runner.labels).
    # Si le job ne demarre jamais, c'est presque toujours ce champ.
    runs-on: docker
    # Version epinglee : une montee de stable apporte de nouveaux lints clippy,
    # donc un rouge surprise sans qu'on ait touche au code.
    container:
      image: rust:1.95-slim
    steps:
      - uses: actions/checkout@v4
      # Les images rust officielles sont installees en profil minimal :
      # ni rustfmt ni clippy. Idempotent s'ils sont deja la.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Pas de cache : zero dependance, la compilation part de std seul.
