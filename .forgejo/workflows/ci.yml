name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    # Depends on the labels declared by the Forgejo runner (config.yml,
    # runner.labels). If the job never starts, it is almost always this field.
    runs-on: docker
    # Pinned version: a stable bump brings new clippy lints, hence a surprise
    # red without anyone having touched the code.
    container:
      image: rust:1.95-slim
    steps:
      - uses: actions/checkout@v4
      # The official rust images ship the minimal profile: neither rustfmt nor
      # clippy. Idempotent when they are already there.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # No cache: zero dependency, the build starts from std alone.
